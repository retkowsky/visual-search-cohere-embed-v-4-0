<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="520" rx="16" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a2e">Cosine Similarity Explained</text>
  <text x="450" y="65" text-anchor="middle" font-size="14" fill="#6c757d">Measures the angle between two vectors — not their magnitude</text>

  <!-- === CASE 1: Similar (cos ≈ 1) === -->
  <g transform="translate(120, 180)">
    <!-- Axes -->
    <line x1="0" y1="130" x2="160" y2="130" stroke="#dee2e6" stroke-width="1.5"/>
    <line x1="0" y1="130" x2="0" y2="-10" stroke="#dee2e6" stroke-width="1.5"/>
    
    <!-- Vector A -->
    <line x1="0" y1="130" x2="140" y2="20" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <text x="145" y="18" font-size="13" font-weight="bold" fill="#2563eb">A</text>
    
    <!-- Vector B -->
    <line x1="0" y1="130" x2="150" y2="40" stroke="#e63946" stroke-width="3" marker-end="url(#arrowRed)"/>
    <text x="155" y="38" font-size="13" font-weight="bold" fill="#e63946">B</text>
    
    <!-- Angle arc -->
    <path d="M 35,98 A 40,40 0 0,1 38,93" stroke="#f59e0b" stroke-width="2" fill="none"/>
    <path d="M 30,105 Q 42,92 38,88" stroke="#f59e0b" stroke-width="2" fill="none"/>
    <text x="48" y="92" font-size="11" fill="#f59e0b" font-weight="bold">θ small</text>
    
    <!-- Label -->
    <rect x="-30" y="150" width="210" height="56" rx="10" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
    <text x="75" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#155724">cos(θ) ≈ 1</text>
    <text x="75" y="192" text-anchor="middle" font-size="12" fill="#155724">Very Similar</text>
  </g>

  <!-- === CASE 2: Orthogonal (cos = 0) === -->
  <g transform="translate(400, 180)">
    <!-- Axes -->
    <line x1="0" y1="130" x2="160" y2="130" stroke="#dee2e6" stroke-width="1.5"/>
    <line x1="0" y1="130" x2="0" y2="-10" stroke="#dee2e6" stroke-width="1.5"/>
    
    <!-- Vector A (horizontal) -->
    <line x1="0" y1="130" x2="140" y2="130" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <text x="145" y="128" font-size="13" font-weight="bold" fill="#2563eb">A</text>
    
    <!-- Vector B (vertical) -->
    <line x1="0" y1="130" x2="0" y2="5" stroke="#e63946" stroke-width="3" marker-end="url(#arrowRed)"/>
    <text x="8" y="2" font-size="13" font-weight="bold" fill="#e63946">B</text>
    
    <!-- Right angle marker -->
    <rect x="0" y="112" width="18" height="18" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="28" y="108" font-size="11" fill="#f59e0b" font-weight="bold">90°</text>
    
    <!-- Label -->
    <rect x="-30" y="150" width="210" height="56" rx="10" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
    <text x="75" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#856404">cos(θ) = 0</text>
    <text x="75" y="192" text-anchor="middle" font-size="12" fill="#856404">No Relationship</text>
  </g>

  <!-- === CASE 3: Opposite (cos = -1) === -->
  <g transform="translate(680, 180)">
    <!-- Axes -->
    <line x1="-80" y1="70" x2="80" y2="70" stroke="#dee2e6" stroke-width="1.5"/>
    <line x1="0" y1="140" x2="0" y2="-10" stroke="#dee2e6" stroke-width="1.5"/>
    
    <!-- Vector A -->
    <line x1="0" y1="70" x2="70" y2="70" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <text x="78" y="68" font-size="13" font-weight="bold" fill="#2563eb">A</text>
    
    <!-- Vector B (opposite) -->
    <line x1="0" y1="70" x2="-70" y2="70" stroke="#e63946" stroke-width="3" marker-end="url(#arrowRed)"/>
    <text x="-85" y="68" font-size="13" font-weight="bold" fill="#e63946">B</text>
    
    <!-- 180° label -->
    <path d="M 25,70 A 25,25 0 1,0 -25,70" stroke="#f59e0b" stroke-width="2" fill="none"/>
    <text x="0" y="52" text-anchor="middle" font-size="11" fill="#f59e0b" font-weight="bold">180°</text>
    
    <!-- Label -->
    <rect x="-105" y="150" width="210" height="56" rx="10" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
    <text x="0" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#721c24">cos(θ) = -1</text>
    <text x="0" y="192" text-anchor="middle" font-size="12" fill="#721c24">Completely Opposite</text>
  </g>

  <!-- Formula box -->
  <rect x="200" y="430" width="500" height="60" rx="12" fill="#1a1a2e"/>
  <text x="450" y="458" text-anchor="middle" font-size="16" fill="#ffffff" font-family="monospace">
    cos(θ) = (A · B) / (‖A‖ × ‖B‖)
  </text>
  <text x="450" y="478" text-anchor="middle" font-size="12" fill="#adb5bd">dot product divided by the product of magnitudes</text>

  <!-- Embedding example -->
  <text x="450" y="510" text-anchor="middle" font-size="12" fill="#6c757d">In embeddings: similar texts → vectors point the same way → cosine similarity close to 1</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e63946"/>
    </marker>
  </defs>
</svg>
